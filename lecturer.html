<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hoca — Sesli QR Yoklama</title>
<link rel="manifest" href="manifest-lecturer.json" />
<meta name="theme-color" content="#0d47a1" />
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; margin: 0; background:#f4f6fa; color:#222; }
  header { background:#0d47a1; color:#fff; padding:14px; text-align:center; font-size:18px; font-weight:600; }
  main { padding:14px; max-width:720px; margin:auto; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  h2 { font-size:15px; margin:0 0 10px; color:#0d47a1; }
  button { padding:10px 14px; border-radius:8px; border:none; background:#0d47a1; color:#fff; font-size:14px; cursor:pointer; margin:4px 4px 4px 0; }
  button:disabled { background:#9aa5b1; cursor:not-allowed; }
  button.danger { background:#c62828; }
  button.success { background:#2e7d32; }
  select, input { padding:8px; border-radius:8px; border:1px solid #ccc; font-size:14px; width:100%; margin:4px 0 8px; }
  .code-display { font-size:52px; letter-spacing:10px; text-align:center; font-weight:700; color:#0d47a1; font-family: "Courier New", monospace; padding:8px; background:#e3f2fd; border-radius:10px; }
  .status { text-align:center; color:#666; font-size:13px; margin:6px 0; }
  #reader { width:100%; max-width:340px; margin:auto; border-radius:12px; overflow:hidden; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ok { color:#2e7d32; font-weight:600; }
  .err { color:#c62828; font-weight:600; }
  .student-card { display:none; }
  .student-card.show { display:block; }
  .student-info { display:flex; gap:14px; align-items:center; }
  .student-info img { width:88px; height:88px; object-fit:cover; border-radius:10px; border:2px solid #0d47a1; background:#eee; }
  .info-line { font-size:14px; margin:2px 0; }
  .info-line b { color:#0d47a1; }
  .warn { background:#ffebee; color:#b71c1c; padding:10px; border-radius:8px; margin-top:8px; font-size:14px; }
  .okmsg { background:#e8f5e9; color:#1b5e20; padding:10px; border-radius:8px; margin-top:8px; font-size:14px; }
  label.check { display:flex; align-items:center; gap:8px; font-size:14px; }
  label.check input { width:auto; margin:0; }
  a.linkbtn { display:inline-block; margin-top:6px; color:#0d47a1; text-decoration:underline; font-size:14px; }
</style>
</head>
<body>
<header>🎓 Hoca Uygulaması — Sesli QR Yoklama</header>
<main>
  <div class="card">
    <h2>Ders & Yayın Kontrolü</h2>
    <label>Ders seçin</label>
    <select id="courseSelect"></select>

    <div class="code-display" id="codeDisplay">----</div>
    <div class="status" id="statusMsg">Yayın durduruldu</div>

    <div class="row" style="margin-top:8px;">
      <button id="startBtn" class="success">▶ Yayını Başlat</button>
      <button id="stopBtn" class="danger" disabled>■ Yayını Durdur</button>
    </div>

    <label class="check" style="margin-top:10px;">
      <input type="checkbox" id="autoCam" /> Otomatik Kamera (yayın başlayınca kamera aç, QR okuyunca kapat)
    </label>
  </div>

  <div class="card">
    <h2>QR Okuma (Kamera)</h2>
    <div id="reader"></div>
    <div class="row" style="margin-top:8px;">
      <button id="camToggleBtn">📷 Kamerayı Aç</button>
    </div>
    <div id="scanMsg" class="status"></div>
  </div>

  <div class="card student-card" id="studentCard">
    <h2>Okutulan Öğrenci</h2>
    <div class="student-info">
      <img id="studentPhoto" alt="Foto" />
      <div>
        <div class="info-line"><b>No:</b> <span id="sNo"></span></div>
        <div class="info-line"><b>Ad Soyad:</b> <span id="sName"></span></div>
        <div class="info-line"><b>Bölüm:</b> <span id="sBolum"></span></div>
        <div class="info-line"><b>Program:</b> <span id="sProgram"></span></div>
        <div class="info-line"><b>Sınıf:</b> <span id="sSinif"></span></div>
      </div>
    </div>
    <div id="resultMsg"></div>
  </div>

  <div class="card">
    <a class="linkbtn" href="report.html">📊 Rapor Ekranına Git →</a>
  </div>
</main>

<script>
/* ================== YARDIMCILAR ================== */
const CODE_INTERVAL = 12000; // 12 sn'de yeni kod
const TONE_MS = 650;
const GAP_MS = 350;

// DTMF tablosu (satır/sütun) — 4 hane için her haneyi sırayla çalıyoruz
const DTMF_ROWS = [697, 770, 852, 941];
const DTMF_COLS = [1209, 1336, 1477, 1633];
function digitToFreqs(d) {
  const n = parseInt(d, 10);           // 0..9
  const row = DTMF_ROWS[Math.floor(n / 3) % 4];
  const col = DTMF_COLS[n % 3];
  return [row, col];
}

let audioCtx = null;
let currentCode = null;
let publishTimer = null;
let publishActive = false;

/* ================== DERS SEÇİMİ ================== */
let courses = [];
let students = [];

async function loadData() {
  courses = await (await fetch('courses.json')).json();
  students = await (await fetch('students.json')).json();
  const sel = document.getElementById('courseSelect');
  courses.forEach(c => {
    const o = document.createElement('option');
    o.value = c.kod;
    o.textContent = `${c.kod} - ${c.ad}`;
    sel.appendChild(o);
  });
  // Seçili dersi hatırla
  const saved = localStorage.getItem('lecturer_course');
  if (saved) sel.value = saved;
  sel.addEventListener('change', () => {
    localStorage.setItem('lecturer_course', sel.value);
  });
}

/* ================== SES ÜRETİMİ ================== */
function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTonePair(freqs, durationMs) {
  const ctx = ensureAudioCtx();
  const t0 = ctx.currentTime;
  const oscs = freqs.map(f => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = f;
    o.type = 'sine';
    g.gain.setValueAtTime(0.0, t0);
    g.gain.linearRampToValueAtTime(0.35, t0 + 0.02);
    g.gain.setValueAtTime(0.35, t0 + durationMs / 1000 - 0.02);
    g.gain.linearRampToValueAtTime(0.0, t0 + durationMs / 1000);
    o.connect(g).connect(ctx.destination);
    o.start(t0);
    o.stop(t0 + durationMs / 1000 + 0.05);
    return o;
  });
  return oscs;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function broadcastCode(code) {
  // 4 haneyi sırayla çal
  for (const d of code) {
    const freqs = digitToFreqs(d);
    playTonePair(freqs, TONE_MS);
    await sleep(TONE_MS + GAP_MS);
  }
}

function randomCode4() {
  return String(Math.floor(Math.random() * 9000) + 1000); // 1000..9999
}

/* ================== YAYIN DÖNGÜSÜ ================== */
async function startPublish() {
  if (publishActive) return;
  publishActive = true;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('statusMsg').textContent = '🔊 Yayın devam ediyor...';

  // Otomatik kamera
  if (document.getElementById('autoCam').checked) {
    await startScanner();
    document.getElementById('camToggleBtn').textContent = '📷 Kamerayı Kapat';
  }

  const loop = async () => {
    while (publishActive) {
      currentCode = randomCode4();
      document.getElementById('codeDisplay').textContent = currentCode;
      // Ekranda kodu göster ve ses çal
      await broadcastCode(currentCode);
      // Yayın periyodunu doldur (12 sn)
      await sleep(Math.max(500, CODE_INTERVAL - (TONE_MS + GAP_MS) * 4));
    }
  };
  loop();
}

function stopPublish() {
  publishActive = false;
  currentCode = null;
  document.getElementById('codeDisplay').textContent = '----';
  document.getElementById('statusMsg').textContent = 'Yayın durduruldu';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  if (scannerRunning) stopScanner();
  document.getElementById('camToggleBtn').textContent = '📷 Kamerayı Aç';
}

document.getElementById('startBtn').onclick = startPublish;
document.getElementById('stopBtn').onclick = stopPublish;

/* ================== QR OKUMA ================== */
let html5Qr = null;
let scannerRunning = false;

async function startScanner() {
  if (scannerRunning) return;
  html5Qr = new Html5Qrcode("reader");
  try {
    await html5Qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      onQrDecoded,
      () => {}
    );
    scannerRunning = true;
  } catch (e) {
    document.getElementById('scanMsg').textContent = '❌ Kamera açılamadı: ' + e;
  }
}

async function stopScanner() {
  if (!scannerRunning) return;
  try { await html5Qr.stop(); await html5Qr.clear(); } catch (e) {}
  scannerRunning = false;
}

document.getElementById('camToggleBtn').onclick = async () => {
  if (scannerRunning) {
    await stopScanner();
    document.getElementById('camToggleBtn').textContent = '📷 Kamerayı Aç';
  } else {
    await startScanner();
    document.getElementById('camToggleBtn').textContent = '📷 Kamerayı Kapat';
  }
};

async function onQrDecoded(decodedText) {
  // QR içeriği: {"no":"2024001","code":"1234","ts":...}
  let data;
  try { data = JSON.parse(decodedText); }
  catch { return; }

  // 1) Kod doğrulama
  if (!currentCode || data.code !== currentCode) {
    document.getElementById('scanMsg').innerHTML =
      `<span class="err">❌ Kod uyuşmuyor. Okunan: ${data.code} — Güncel: ${currentCode || 'yok'}</span>`;
    return;
  }

  // 2) Öğrenci bul
  const student = students.find(s => s.no === data.no);
  if (!student) {
    document.getElementById('scanMsg').innerHTML =
      `<span class="err">❌ Öğrenci bulunamadı: ${data.no}</span>`;
    return;
  }

  // 3) Ders kontrolü
  const courseCode = document.getElementById('courseSelect').value;
  const course = courses.find(c => c.kod === courseCode);
  if (!course || !course.ogrenciler.includes(student.no)) {
    showStudent(student, `<div class="warn">⚠️ ${student.ad} ${student.soyad} bu derse (${courseCode}) kayıtlı değil!</div>`);
    return;
  }

  // 4) Hafta & tek imza kuralı
  const week = getCurrentWeek();
  const key = `att_${courseCode}_${student.no}_${week}`;
  if (localStorage.getItem(key)) {
    showStudent(student, `<div class="warn">⚠️ ${student.ad} ${student.soyad} bu hafta (H${week}) zaten yoklamaya katıldı.</div>`);
    return;
  }
  localStorage.setItem(key, JSON.stringify({ ts: Date.now(), week }));
  showStudent(student, `<div class="okmsg">✅ ${student.ad} ${student.soyad} — Hafta ${week} yoklaması kaydedildi.</div>`);

  // Başarılı okuma -> otomatik kamera kapat
  if (document.getElementById('autoCam').checked && scannerRunning) {
    await stopScanner();
    document.getElementById('camToggleBtn').textContent = '📷 Kamerayı Aç';
  }
}

function showStudent(s, resultHtml) {
  const card = document.getElementById('studentCard');
  card.classList.add('show');
  document.getElementById('sNo').textContent = s.no;
  document.getElementById('sName').textContent = s.ad + ' ' + s.soyad;
  document.getElementById('sBolum').textContent = s.bolum;
  document.getElementById('sProgram').textContent = s.program;
  document.getElementById('sSinif').textContent = s.sinif;
  const img = document.getElementById('studentPhoto');
  img.src = `photos/${s.no}.jpeg`;
  img.onerror = () => { img.src = ''; img.style.background = '#ccc'; };
  document.getElementById('resultMsg').innerHTML = resultHtml;
}

/* ================== HAFTA HESABI ================== */
// Basit yaklaşım: yılın başından itibaren 7 günlük dilimler. 14 haftayla sınırla.
function getCurrentWeek() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const diff = Math.floor((now - start) / (7 * 24 * 3600 * 1000)) + 1;
  return Math.min(14, Math.max(1, diff % 14 || 14));
}

/* ================== BAŞLAT ================== */
loadData();

// Service worker
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
