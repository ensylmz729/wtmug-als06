<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rapor — Sesli QR Yoklama</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; margin:0; background:#f4f6fa; color:#222; }
  header { background:#0d47a1; color:#fff; padding:14px; text-align:center; font-size:18px; font-weight:600; }
  main { padding:14px; max-width:1000px; margin:auto; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  h2 { font-size:15px; margin:0 0 10px; color:#0d47a1; }
  select { padding:8px; border-radius:8px; border:1px solid #ccc; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th, td { border:1px solid #ddd; padding:6px 4px; text-align:center; }
  th { background:#e3f2fd; color:#0d47a1; }
  td.name { text-align:left; white-space:nowrap; font-weight:600; }
  .ok { color:#2e7d32; font-weight:700; }
  .no { color:#c62828; }
  .total { font-weight:700; background:#f1f8e9; }
  .scroll { overflow-x:auto; }
  a.back { display:inline-block; margin-bottom:8px; color:#0d47a1; text-decoration:underline; }
</style>
</head>
<body>
<header>📊 Rapor Ekranı</header>
<main>
  <a class="back" href="lecturer.html">← Hoca Uygulamasına Dön</a>
  <div class="card">
    <h2>Ders Seçimi</h2>
    <select id="courseSelect"></select>
  </div>
  <div class="card">
    <h2>Haftalık Yoklama Tablosu</h2>
    <div class="scroll"><table id="reportTable"></table></div>
  </div>
</main>

<script>
let courses = [], students = [];

async function load() {
  courses = await (await fetch('courses.json')).json();
  students = await (await fetch('students.json')).json();
  const sel = document.getElementById('courseSelect');
  courses.forEach(c => {
    const o = document.createElement('option');
    o.value = c.kod;
    o.textContent = `${c.kod} - ${c.ad}`;
    sel.appendChild(o);
  });
  sel.onchange = render;
  render();
}

function render() {
  const code = document.getElementById('courseSelect').value;
  const course = courses.find(c => c.kod === code);
  const table = document.getElementById('reportTable');
  if (!course) { table.innerHTML = ''; return; }

  // Sadece derse kayıtlı öğrenciler
  const list = students.filter(s => course.ogrenciler.includes(s.no));

  // Başlık
  let html = '<thead><tr><th>Öğrenci</th>';
  for (let w = 1; w <= 14; w++) html += `<th>H${w}</th>`;
  html += '<th>Toplam</th></tr></thead><tbody>';

  list.forEach(s => {
    html += `<tr><td class="name">${s.no} - ${s.ad} ${s.soyad}</td>`;
    let total = 0;
    for (let w = 1; w <= 14; w++) {
      const key = `att_${course.kod}_${s.no}_${w}`;
      const has = !!localStorage.getItem(key);
      if (has) total++;
      html += `<td class="${has ? 'ok' : 'no'}">${has ? '✔' : '✘'}</td>`;
    }
    html += `<td class="total">${total}</td></tr>`;
  });

  html += '</tbody>';
  table.innerHTML = html;
}

load();
</script>
</body>
</html>
